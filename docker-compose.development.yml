services:
  backend:
    image: kalyonekenobe/funders:backend
    platform: linux/amd64
    build:
      dockerfile: Dockerfile.development
    container_name: funders-backend
    networks:
      - funders-network
    env_file:
      - ./env/.env.development
    ports:
      - 8000:${DOCKER_INTERNAL_BACKEND_PORT}
    volumes:
      - ./src:/app/src
      - ./prisma/migrations:/app/prisma/migrations
      - ./prisma/seeders:/app/prisma/seeders
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4096M
    restart: on-failure

  database:
    image: kalyonekenobe/funders:database
    build:
      dockerfile_inline: |
        FROM postgres:latest
    container_name: funders-database
    networks:
      - funders-network
    env_file:
      - ./env/.env.development
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - ${DOCKER_INTERNAL_DATABASE_PORT}
    expose:
      - ${DOCKER_INTERNAL_DATABASE_PORT}
    volumes:
      - funders-database-volume:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}'"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure

  nginx:
    image: kalyonekenobe/funders:nginx
    platform: linux/amd64
    build:
      dockerfile_inline: |
        FROM nginx:latest
    container_name: funders-nginx
    networks:
      - funders-network
    env_file: ./env/.env.development
    ports:
      - 80:${DOCKER_INTERNAL_NGINX_PORT}
    volumes:
      - ./nginx/default.development.conf:/etc/nginx/conf.d/default.conf
    expose:
      - ${DOCKER_INTERNAL_NGINX_PORT}
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'service nginx status || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure

  redis:
    image: kalyonekenobe/funders:redis
    build:
      dockerfile_inline: |
        FROM redis:alpine
        COPY ./entrypoints/redis-entrypoint.sh /usr/local/bin/redis-entrypoint.sh
        RUN chmod +x /usr/local/bin/redis-entrypoint.sh
    container_name: funders-redis
    networks:
      - funders-network
    env_file:
      - ./env/.env.development
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USERNAME=${REDIS_USERNAME}
    ports:
      - 6479:${DOCKER_INTERNAL_REDIS_PORT}
    volumes:
      - funders-redis-volume:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'redis-cli --raw incr ping'"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure
    entrypoint: /usr/local/bin/redis-entrypoint.sh

networks:
  funders-network:
    driver: bridge

volumes:
  funders-database-volume:
  funders-redis-volume:
