services:
  backend:
    image: kalyonekenobe/funders:backend
    platform: linux/amd64
    build:
      dockerfile: Dockerfile.production
    container_name: funders-backend
    networks:
      - funders-network
    env_file:
      - ./env/.env.production
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CLIENT_URI: ${CLIENT_URI}
      SERVER_URI: ${SERVER_URI}
      DATABASE_TYPE: ${DATABASE_TYPE}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_BUCKET_NAME: ${SUPABASE_BUCKET_NAME}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      COOKIE_ACCESS_TOKEN_NAME: ${COOKIE_ACCESS_TOKEN_NAME}
      COOKIE_REFRESH_TOKEN_NAME: ${COOKIE_REFRESH_TOKEN_NAME}
      COOKIE_OAUTH2_TOKEN_NAME: ${COOKIE_OAUTH2_TOKEN_NAME}
      COOKIE_ACCOUNT_COMPLETION_TOKEN_NAME: ${COOKIE_ACCOUNT_COMPLETION_TOKEN_NAME}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECRET: ${COOKIE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_DURATION: ${JWT_ACCESS_TOKEN_DURATION}
      JWT_REFRESH_TOKEN_DURATION: ${JWT_REFRESH_TOKEN_DURATION}
      JWT_REFRESH_TOKEN_EXTENDED_DURATION: ${JWT_REFRESH_TOKEN_EXTENDED_DURATION}
      JWT_OAUTH2_TOKEN_DURATION: ${JWT_OAUTH2_TOKEN_DURATION}
      JWT_ACCOUNT_COMPLETION_TOKEN_DURATION: ${JWT_ACCOUNT_COMPLETION_TOKEN_DURATION}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      USER_PASSWORD_SALT_PREFIX: ${USER_PASSWORD_SALT_PREFIX}
      USER_PASSWORD_SALT_SUFFIX: ${USER_PASSWORD_SALT_SUFFIX}
      USER_PASSWORD_SALT_ROUNDS: ${USER_PASSWORD_SALT_ROUNDS}
      DEFAULT_LOG_LEVEL: ${DEFAULT_LOG_LEVEL}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_DEFAULT_CURRENCY: ${STRIPE_DEFAULT_CURRENCY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED}
      REDIS_TLS_CA: ${REDIS_TLS_CA}
      REDIS_TLS_KEY: ${REDIS_TLS_KEY}
      REDIS_TLS_CERT: ${REDIS_TLS_CERT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SOLANA_RPC_HTTP_ENDPOINT: ${SOLANA_RPC_HTTP_ENDPOINT}
      AUTH_MESSAGE_TEMPLATE: ${AUTH_MESSAGE_TEMPLATE}
      FUNDERS_CORE_PROGRAM_ID: ${FUNDERS_CORE_PROGRAM_ID}
      FUNDERS_CORE_PROGRAM_ADMIN_PUBLIC_KEY: ${FUNDERS_CORE_PROGRAM_ADMIN_PUBLIC_KEY}
      FUNDERS_CORE_PROGRAM_ADMIN_PRIVATE_KEY: ${FUNDERS_CORE_PROGRAM_ADMIN_PRIVATE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    ports:
      - 8000:${DOCKER_INTERNAL_BACKEND_PORT}
    volumes:
      - ./src:/app/src
      - ./prisma/migrations:/app/prisma/migrations
      - ./prisma/seeders:/app/prisma/seeders
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: on-failure

  database:
    image: kalyonekenobe/funders:database
    platform: linux/amd64
    build:
      dockerfile_inline: |
        FROM postgres:latest
    container_name: funders-database
    networks:
      - funders-network
    env_file:
      - ./env/.env.production
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - ${DOCKER_INTERNAL_DATABASE_PORT}
    expose:
      - ${DOCKER_INTERNAL_DATABASE_PORT}
    volumes:
      - funders-database-volume:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}'"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure

  redis:
    image: kalyonekenobe/funders:redis
    build:
      dockerfile_inline: |
        FROM redis:alpine
        COPY ./entrypoints/redis-entrypoint.sh /usr/local/bin/redis-entrypoint.sh
        RUN chmod +x /usr/local/bin/redis-entrypoint.sh
    container_name: funders-redis
    networks:
      - funders-network
    env_file:
      - ./env/.env.production
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USERNAME=${REDIS_USERNAME}
    ports:
      - 6479:${DOCKER_INTERNAL_REDIS_PORT}
    volumes:
      - funders-redis-volume:/data
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'redis-cli --raw incr ping'"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure
    entrypoint: /usr/local/bin/redis-entrypoint.sh

networks:
  funders-network:
    driver: bridge

volumes:
  funders-database-volume:
  funders-redis-volume:
